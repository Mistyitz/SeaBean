<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display SVG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Method 1: Using an img tag (Recommended for simple display) -->
    <img src="https://cdn.jsdelivr.net/gh/Mr-Calvin-Math-Class/discrete-chaos-3164@main/INVADDEX.SVG" alt="INVADDEX SVG Graphic">

    <!-- Method 2: Using an object tag (Allows interaction/CSS styling from parent if needed)
    <object data="https://cdn.jsdelivr.net/gh/Mr-Calvin-Math-Class/discrete-chaos-3164@main/INVADDEX.SVG" type="image/svg+xml">
        Your browser doesn't support SVG
    </object> 
    -->

</body>
</html>
